# 24-hour top-up. Fill the three hosts before starting.
# Leave the September scripts alone. This file is only for the top-up.

LAB_HOST=
UAE_HOST=
EU_HOST=

# One port per path, on every iperf3 server (lab, UAE, Europe).
FIBER_PORT=5202
FWA_PORT=5203
MOBILE_PORT=5204
LEO_PORT=5201

FIBER_SIP=5062
FWA_SIP=5063
MOBILE_SIP=5064
LEO_SIP=5061

# TCP: 4 streams, 30 seconds. UDP stays 10 Mb/s.
IPERF_STREAMS=4
IPERF_SECONDS=30
UDP_BITRATE=10M
UDP_SECONDS=60

HOURS=24
# Idle RTT, DNS, TCP, TLS, TTFB.
LIGHT_INTERVAL_SEC=300
# Download and upload to all three endpoints. 1800 s is 30 minutes.
IPERF_INTERVAL_SEC=1800
UDP_INTERVAL_SEC=900
VOIP_INTERVAL_SEC=1800
GAMING_INTERVAL_SEC=1800
# One ping per second, to each endpoint. September used 60 s.
RELIABILITY_INTERVAL_SEC=1
OOKLA_INTERVAL_SEC=3600
# Empty means Ookla picks a server, and the chosen id is still recorded.
OOKLA_SERVER_ID=

HTTPS_1=https://www.eand.ae/ar/index.html
HTTPS_1_NAME=eand.ae
HTTPS_2=https://www.khaleejtimes.com/
HTTPS_2_NAME=khaleejtimes.com
DNS_SERVER=1.1.1.1
DNS_NAME=www.eand.ae

SIP_CALLS=20
SIP_RATE=1
SIP_HOLD_MS=3000

# Timeouts. A test that exceeds the process cap is stored as FAIL, not dropped.
PING_WAIT_SEC=2
PING_PROCESS_SEC=4
DIG_QUERY_SEC=3
DIG_PROCESS_SEC=10
CURL_MAX_SEC=30
CURL_PROCESS_SEC=40
IPERF_EXTRA_SEC=30
VOICE_SECONDS=150
OOKLA_TIMEOUT_SEC=180
SIP_TIMEOUT_SEC=60
SIP_PROCESS_FLOOR_SEC=120
